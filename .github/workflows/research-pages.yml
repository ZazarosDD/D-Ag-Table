name: Chemie aktuell – Website aktualisieren
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/update_research.py'
      - '.github/workflows/research-pages.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Forschungsdaten aktualisieren
        run: python3 scripts/update_research.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
